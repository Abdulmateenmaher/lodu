name: Build and Deploy Flutter Web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2

    - name: Get dependencies
      run: flutter pub get

    - name: Build web
      run: flutter build web --release --base-href /lodu/

    - name: Modify service worker for offline support
      run: |
        # Ensure all resources including audio assets are cached for offline use
        sed -i '116a\      await contentCache.addAll(Object.keys(RESOURCES));' build/web/flutter_service_worker.js

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/web